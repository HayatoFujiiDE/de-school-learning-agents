<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font-family:sans-serif;max-width:100%;padding:1rem}#lamp{width:3rem;height:3rem;border-radius:50%;background:#fc0}</style></head>
<body><p>スライダーを動かすと、明かりがつくかどうかが変わります。</p><input id="d" type="range" min="1" max="20" value="5"><span id="v">5</span><div id="lamp"></div>
<script>var d=document.getElementById('d');d.oninput=function(){document.getElementById('v').textContent=d.value;document.getElementById('lamp').style.background=d.value>15?'#ccc':'#fc0';};</script></body></html>
