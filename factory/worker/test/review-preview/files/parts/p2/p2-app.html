<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>血の流れ（作り物）</title>
<style>body{margin:0;font-family:sans-serif;background:#fff8e8;color:#292c29}label{display:block;padding:12px 16px}canvas{display:block;width:100%;height:220px}</style></head>
<body><label>はやさ <input id="s" type="range" min="1" max="10" value="3"></label><canvas id="c" width="800" height="220"></canvas>
<script>
var c=document.getElementById('c'),x=c.getContext('2d'),s=document.getElementById('s'),t=0;
function draw(){x.clearRect(0,0,800,220);x.fillStyle='#f3c1bd';x.fillRect(0,80,800,60);for(var i=0;i<14;i++){var px=((i*60+t*Number(s.value))%860)-30;x.beginPath();x.fillStyle='#d9534f';x.arc(px,110,16,0,Math.PI*2);x.fill();}t+=1;requestAnimationFrame(draw);}draw();
</script></body></html>
